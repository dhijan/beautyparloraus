services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-beauty_parlour_db}
      POSTGRES_USER: ${DB_USER:-beauty_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_database_password}
    volumes:
      - beauty_postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-beauty_parlour_db}
      DB_USER: ${DB_USER:-beauty_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_this_database_password}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      ADMIN_KEY: ${ADMIN_KEY:-change_this_legacy_admin_key}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change_this_long_random_jwt_secret}
      ADMIN_TOKEN_EXPIRES_IN: ${ADMIN_TOKEN_EXPIRES_IN:-1d}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Brow Beauty Hub <onboarding@resend.dev>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      CONTACT_RECEIVER_EMAIL: ${CONTACT_RECEIVER_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend/beautyParlor
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  beauty_postgres_data:
